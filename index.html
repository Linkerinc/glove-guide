<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3M 장갑 셀렉션 가이드</title>
<style>
:root{
  --red:#e3000f; --red-dark:#b8000c;
  --bg:#f8f9fa; --card:#ffffff; --text:#212529; --sub:#6c757d; --line:#dee2e6;
  --b2b:#1d5bd8; --b2b-dark:#1548ad;
  --ecom:#1e9e50; --ecom-dark:#177c3f;
  --event:#e3000f;
  --sg:#e3000f; --cg:#495057;
}
*{box-sizing:border-box}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,Roboto,'Noto Sans KR',sans-serif;
  background:var(--bg); color:var(--text); margin:0; padding:16px;
  display:flex; justify-content:center; min-height:100vh;
}
.container{
  background:var(--card); border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.06);
  width:100%; max-width:650px; padding:24px 22px 30px; text-align:center; position:relative;
  height:fit-content;
}
.header{display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding-bottom:12px; margin-bottom:22px; min-height:40px; position:relative}
.logo{font-size:28px; font-weight:900; color:var(--red); letter-spacing:-1px; margin:0; position:absolute; left:50%; transform:translateX(-50%)}
.nav-btn{background:none; border:none; font-size:14px; font-weight:600; color:var(--sub); cursor:pointer; padding:8px 10px; border-radius:8px; z-index:2}
.nav-btn:hover{background:#f1f3f5; color:var(--text)}
.nav-btn.hidden{visibility:hidden}

/* start */
.start-wrap{padding:34px 0 40px; animation:fadeIn .4s ease}
.start-title{font-size:28px; font-weight:800; line-height:1.35; letter-spacing:-.5px; margin:0 0 14px; word-break:keep-all}
.start-title .hl{color:var(--red)}
.start-desc{font-size:16px; color:var(--sub); line-height:1.65; margin:0 0 34px; word-break:keep-all}
.big-btn{background:var(--red); color:#fff; border:none; border-radius:12px; padding:18px 38px; font-size:17px; font-weight:700; cursor:pointer; box-shadow:0 8px 20px rgba(227,0,15,.22); transition:all .25s}
.big-btn:hover{background:var(--red-dark); transform:translateY(-2px)}

/* question */
.q-wrap{animation:fadeIn .35s ease}
.q-step{font-size:13px; font-weight:700; color:var(--red); letter-spacing:.5px; margin-bottom:10px}
.q-title{font-size:21px; font-weight:800; line-height:1.4; margin:0 0 24px; word-break:keep-all; letter-spacing:-.3px}
.opts{display:flex; flex-direction:column; gap:12px}
.opt{background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:16px 18px; font-size:15.5px; font-weight:600; line-height:1.5; cursor:pointer; text-align:left; transition:all .18s; word-break:keep-all; color:var(--text)}
.opt:hover{border-color:var(--red); background:#fff5f5; transform:translateY(-1px)}
.opt .tag{display:block; font-size:12.5px; font-weight:500; color:var(--sub); margin-top:4px}

/* result */
.r-wrap{animation:fadeIn .4s ease; text-align:left}
.r-head{text-align:center; margin-bottom:6px}
.r-eyebrow{font-size:14px; color:var(--sub); margin:0 0 6px}
.r-name{font-size:27px; font-weight:900; letter-spacing:-.5px; margin:0}
.r-name.sg{color:var(--sg)}
.r-name.cg{color:var(--cg)}
.sg-badge{display:inline-block; background:var(--red); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.6px; border-radius:20px; padding:4px 12px; margin-bottom:8px}
.r-img{width:200px; height:200px; margin:16px auto; border-radius:14px; background:#f1f3f5 url() center/contain no-repeat; display:flex; align-items:center; justify-content:center; color:#adb5bd; font-size:13px; font-weight:600; overflow:hidden}
.r-img img{width:100%; height:100%; object-fit:contain; display:block}
.r-desc{background:#f8f9fa; border-radius:12px; padding:16px 18px; margin:14px 0}
.r-desc li{font-size:14.5px; line-height:1.65; margin:0 0 8px; word-break:keep-all; color:#343a40}
.r-desc li:last-child{margin-bottom:0}
.r-desc ul{margin:0; padding-left:18px}
.sec{margin:18px 0}
.sec-t{font-size:14px; font-weight:800; color:var(--text); margin:0 0 10px; text-align:center}
.chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.chip{background:#212529; color:#fff; font-size:12.5px; font-weight:600; border-radius:20px; padding:6px 13px}
.chip.cert{background:#fff; color:#212529; border:1.5px solid #212529; font-weight:700}
.cert-marks{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; align-items:center}
.cert-mark{display:flex; flex-direction:column; align-items:center; gap:3px}
.cert-mark img{height:46px; width:auto; display:block}
.cert-mark .cert-cap{font-size:10.5px; color:var(--sub); font-weight:600}
.colors{font-size:14px; color:#343a40; text-align:center; line-height:1.6}
.notice{background:#fff8e6; border:1.5px solid #ffd043; border-radius:12px; padding:14px 16px; font-size:13px; line-height:1.65; color:#6b5300; margin:18px 0; word-break:keep-all}
.notice b{color:#8a6d00}
.buy-area{display:flex; flex-direction:column; gap:10px; margin:22px 0 4px}
.buy-btn{display:block; width:100%; border:none; border-radius:12px; padding:16px; font-size:16px; font-weight:800; color:#fff; cursor:pointer; text-decoration:none; text-align:center; transition:all .2s}
.buy-btn.b2b{background:var(--b2b)} .buy-btn.b2b:hover{background:var(--b2b-dark)}
.buy-btn.ecom{background:var(--ecom)} .buy-btn.ecom:hover{background:var(--ecom-dark)}
.buy-btn.event{background:var(--event)} .buy-btn.event:hover{background:var(--red-dark)}
.retry{background:none; border:none; color:var(--sub); font-size:14px; font-weight:600; text-decoration:underline; cursor:pointer; margin:18px auto 0; display:block}

/* detail page (A+ content) */
.detail-sec{margin:14px 0 4px}
.detail-toggle{display:block; width:100%; background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:14px; font-size:15px; font-weight:700; color:var(--text); cursor:pointer; transition:all .18s}
.detail-toggle:hover{border-color:var(--red); color:var(--red)}
.detail-body{display:none; margin-top:12px; border-radius:12px; overflow:hidden}
.detail-body.open{display:block}
.detail-body img{width:100%; display:block}
.detail-placeholder{background:#f1f3f5; border-radius:12px; padding:26px 16px; text-align:center; color:#adb5bd; font-size:13px; font-weight:600}

/* sub product (리얼터치) */
.sub-card{border:1.5px solid var(--line); border-radius:14px; padding:18px; margin-top:26px}
.sub-label{font-size:12.5px; font-weight:800; color:var(--sub); letter-spacing:.5px; margin-bottom:6px; text-align:center}
.sub-card .r-name{font-size:21px}

@keyframes fadeIn{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
@media (max-width:480px){
  .container{padding:20px 16px 26px}
  .start-title{font-size:24px}
  .q-title{font-size:19px}
}
</style>
</head>
<body>

  <div class="header">

// 예) ?ch=mim  ?ch=ecom  ?ch=offline_dealerA

const TRACKING_ENDPOINT = '';

// 이벤트 참여 폼 URL (오프라인 버전, 추후 확정)
const EVENT_URL = '';

function track(ev, data){
  const payload = {ev, ch:CHANNEL, t:Date.now(), ...data};
  if(TRACKING_ENDPOINT){
    try{ navigator.sendBeacon(TRACKING_ENDPOINT, JSON.stringify(payload)); }catch(e){}
  }
  console.log('[track]', payload);
}

/* 인증서 마크 이미지 파일명 매핑 — images/certs/ 폴더에 파일 넣으면 자동으로 마크 표시, 없으면 텍스트 뱃지 폴백 */
function certFileId(label){
  const map = {'CE인증':'ce','더마테스트':'dermatest','오코텍스 스탠다드 100':'oekotex100','NY-SHELRON®':'nyshelron','Dyneema®':'dyneema'};
  if(map[label]) return map[label];
  return label.toLowerCase().replace(/®/g,'').replace(/\s+/g,'_'); // EN388 4X31A → en388_4x31a, ANSI A1 → ansi_a1
}
function certMark(label){
  const id = certFileId(label);
  return `<span class="cert-mark">
    <img src="images/certs/${id}.png" alt="${esc(label)}"
      onerror="this.closest('.cert-mark').outerHTML='<span class=&quot;chip cert&quot;>${esc(label)}</span>'">
    <span class="cert-cap">${esc(label)}</span>
  </span>`;
}

const NOCUT_NOTICE = '⚠️ 3M 베임방지 장갑은 상해를 줄여주는 <b>보조 보호구</b>이며, 기계나 톱날을 완벽히 막아내는 절단/끼임 방지용 장비가 아니므로 안전에 유의하여 사용해 주세요.';

/* ================= 렌더링 ================= */
const app = document.getElementById('app');
const backBtn = document.getElementById('backBtn');
const homeBtn = document.getElementById('homeBtn');
let history = [];

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function nl(s){return esc(s).replace(/\n/g,'<br>')}

function renderStart(){
  history = [];
  updateNav(null);
  app.innerHTML = `
  <div class="start-wrap">
    <h2 class="start-title">나에게 <span class="hl">딱 맞는 장갑</span> 찾기</h2>
    <p class="start-desc">현재 종사하시는 산업과 작업 환경을 선택하시면,<br>가장 안전하고 편안한 최적의 3M 장갑을 추천해 드립니다.</p>
    <button class="big-btn" onclick="startTest()">추천 테스트 시작하기</button>
  </div>`;
}

function startTest(){
  track('start');
  goNode('industry');
}

function goNode(id, push=true){
  if(push) history.push(id);
  updateNav(id);
  const node = T[id];
  app.innerHTML = `
  <div class="q-wrap">
    <div class="q-step">${node.step}</div>
    <h2 class="q-title">${nl(node.q)}</h2>
    <div class="opts">
      ${node.opts.map((o,i)=>`
        <button class="opt" onclick="choose('${id}',${i})">${esc(o.label)}${o.tag?`<span class="tag">${esc(o.tag)}</span>`:''}</button>
      `).join('')}
    </div>
  </div>`;
  window.scrollTo({top:0});
}

function choose(nodeId, idx){
  const opt = T[nodeId].opts[idx];
  track('answer', {node:nodeId, pick:idx});
  if(opt.result) showResult(opt.result);
  else goNode(opt.next);
}

function buyButtons(p, pid){
  if(IS_OFFLINE){
    return `<a class="buy-btn event" href="${EVENT_URL||'#'}" onclick="track('event_click',{p:'${pid}'})">🎁 이벤트 참여하기</a>`;
  }
  let html = '';
  if(p.b2b) html += `<a class="buy-btn b2b" href="${p.b2b}" target="_blank" rel="noopener" onclick="track('buy_click',{p:'${pid}',mall:'b2b'})">B2B몰에서 구매하러 가기</a>`;
  if(p.ecom) html += `<a class="buy-btn ecom" href="${p.ecom}" target="_blank" rel="noopener" onclick="track('buy_click',{p:'${pid}',mall:'ecom'})">e-com에서 구매하러 가기</a>`;
  return html;
}

function productBlock(pid, isSub=false){
  const p = P[pid];
  const sg = p.brand === 'sg';
  return `
  ${isSub ? `<div class="sub-label">함께 추천드리는 제품</div>` : ''}
  <div class="r-head">
    ${!isSub ? `<p class="r-eyebrow">고객님의 현장과 작업에 가장 완벽한 장갑은</p>` : ''}
    ${sg && !isSub ? `<div><span class="sg-badge">3M BEST SELLER</span></div>` : ''}
    <h2 class="r-name ${p.brand}">${esc(p.name)}</h2>
  </div>
  <div class="r-img" data-pid="${pid}">
    <img src="images/${pid}.png" alt="${esc(p.name)}"
      onerror="if(!this.dataset.j){this.dataset.j=1;this.src='images/${pid}.jpg';}else{this.parentNode.textContent='제품 이미지 준비 중';}">
  </div>
  <div class="r-desc"><ul>${p.desc.map(d=>`<li>${esc(d)}</li>`).join('')}</ul></div>
  ${p.certs.length ? `<div class="sec"><p class="sec-t">인증서</p><div class="cert-marks">${p.certs.map(c=>certMark(c)).join('')}</div></div>` : ''}
  <div class="sec"><p class="sec-t">작업 용도</p><div class="chips">${p.uses.map(u=>`<span class="chip">${esc(u)}</span>`).join('')}</div></div>
  <div class="sec"><p class="sec-t">기능</p><div class="chips">${p.funcs.map(f=>`<span class="chip">${esc(f)}</span>`).join('')}</div></div>
  <div class="sec"><p class="sec-t">제품 색상</p><p class="colors">${esc(p.colors)}</p></div>
  ${p.nocut ? `<div class="notice">${NOCUT_NOTICE}</div>` : ''}
  <div class="buy-area">${buyButtons(p, pid)}</div>
  ${detailSection(pid)}`;
}

function detailSection(pid){
  const n = DETAIL_COUNTS[pid];
  if(n === undefined && Object.keys(DETAIL_COUNTS).length === 0){
    // 빌드 전 검수용: 위치만 표시
    return `<div class="detail-sec"><div class="detail-placeholder">상세페이지 영역 — 배포 버전에서 표시됩니다</div></div>`;
  }
  if(!n) return '';
  let imgs = '';
  for(let i=1;i<=n;i++) imgs += `<img src="images/detail/${pid}/${i}.webp" loading="lazy" alt="">`;
  return `<div class="detail-sec">
    <button class="detail-toggle" onclick="toggleDetail(this,'${pid}')">상세정보 펼쳐보기 ▾</button>
    <div class="detail-body">${imgs}</div>
  </div>`;
}
function toggleDetail(btn, pid){
  const body = btn.nextElementSibling;
  const open = body.classList.toggle('open');
  btn.innerHTML = open ? '상세정보 접기 ▴' : '상세정보 펼쳐보기 ▾';
  if(open) track('detail_open', {p:pid});
}

function showResult(pid){
  history.push('RESULT:'+pid);
  updateNav('RESULT');
  track('result', {p:pid});
  let html = `<div class="r-wrap">${productBlock(pid)}`;
  // 컴포트그립 윈터 결과 → 리얼터치 동일 화면 서브 노출 (3M 확정 26.08)
  if(pid === 'cgwinter'){
    track('result_sub', {p:'cgreal'});
    html += `<div class="sub-card">${productBlock('cgreal', true)}</div>`;
  }
  html += `<button class="retry" onclick="goHome()">다시 테스트하기</button></div>`;
  app.innerHTML = html;
  window.scrollTo({top:0});
}

function updateNav(cur){
  const inFlow = history.length > 0;
  backBtn.classList.toggle('hidden', !inFlow);
  homeBtn.classList.toggle('hidden', !inFlow);
}

function goBack(){
  history.pop();
  if(history.length === 0){ renderStart(); return; }
  const prev = history[history.length-1];
  if(prev.startsWith('RESULT:')) showResult(prev.slice(7));
  else goNode(prev, false);
}

function goHome(){ renderStart(); }

renderStart();
track('pageview');
</script>
